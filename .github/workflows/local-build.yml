name: Local build

# Builds the patched linux/amd64 binary on every push to the feature branch and
# republishes it under the rolling "local-latest" release, so the VPS can always
# download one stable URL. A failed run notifies the pusher by email.

on:
  push:
    branches:
      - feat/token-metric
  workflow_dispatch:

concurrency:
  group: local-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true

      - name: Resolve version
        id: version
        run: echo "value=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: Build web
        working-directory: web
        env:
          DISABLE_ESLINT_PLUGIN: 'true'
          VITE_REACT_APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build binary
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
          GOWORK: 'off'
        run: |
          go build -trimpath \
            -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=${{ steps.version.outputs.value }}'" \
            -o new-api .

      - name: Verify the patched frontend is embedded
        run: grep -qa dashboard_consumption_metric new-api

      - name: Package
        run: |
          sha256sum new-api > new-api.sha256
          cat new-api.sha256

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view local-latest >/dev/null 2>&1 || \
            gh release create local-latest --title "Local build" --notes "Rolling build of feat/token-metric."
          gh release upload local-latest new-api new-api.sha256 --clobber
