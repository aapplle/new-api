name: Local build

# Builds the patched linux/amd64 binary and publishes it under the upstream
# version tag it is based on (for example v1.0.0-rc.47), so the reported version
# matches an official release and the update checker can compare it normally.
# A failed run notifies the pusher by email.

on:
  push:
    branches:
      - feat/token-metric
  workflow_dispatch:

concurrency:
  group: local-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # git describe needs the history back to the last upstream tag.
          fetch-depth: 0

      - name: Resolve upstream version
        id: version
        run: |
          # Forks do not carry upstream tags, so pull them explicitly.
          git fetch --tags --force https://github.com/QuantumNous/new-api.git 'refs/tags/*:refs/tags/*'
          VERSION=$(git describe --tags --match 'v[0-9]*' --abbrev=0 || true)
          if [ -z "$VERSION" ]; then
            echo "::error::No upstream tag reachable from HEAD"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION at $(git rev-parse --short HEAD)"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true

      - name: Build web
        working-directory: web
        env:
          DISABLE_ESLINT_PLUGIN: 'true'
          VITE_REACT_APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build binary
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
          GOWORK: 'off'
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION'" \
            -o new-api .

      - name: Verify the build carries the patch and the version
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          grep -qa dashboard_consumption_metric new-api
          grep -qaF "$VERSION" new-api
          echo "patched frontend and version $VERSION are embedded"

      - name: Package
        run: |
          sha256sum new-api > new-api.sha256
          cat new-api.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          NOTES="Patched build of feat/token-metric on top of $VERSION (commit $(git rev-parse --short HEAD))."
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" new-api new-api.sha256 --clobber
            gh release edit "$VERSION" --notes "$NOTES"
          else
            gh release create "$VERSION" new-api new-api.sha256 \
              --target "$GITHUB_SHA" --title "$VERSION" --notes "$NOTES"
          fi
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/new-api"
